name: Build Lambda
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          rm -rf build
          mkdir -p build/plugins/utils
          pip install -r requirements_example.txt -t build --no-cache-dir

          rm -rf build/pyarrow build/pyarrow-*.dist-info
          rm -rf build/pandas build/pandas-*.dist-info
          rm -rf build/numpy build/numpy.libs build/numpy-*.dist-info
          rm -rf build/boto3 build/boto3-*.dist-info
          rm -rf build/botocore build/botocore-*.dist-info
          rm -rf build/s3transfer build/s3transfer-*.dist-info

          find build -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null
          find build -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null
          find build -type d -name "tests" -exec rm -rf {} + 2>/dev/null
          find build -type d -name "test" -exec rm -rf {} + 2>/dev/null
          find build -name "*.pyc" -delete

          cp business_logic/alpenmechanik/lambda_function.py build/
          cp business_logic/alpenmechanik/alpenmechanik_data.py build/
          cp plugins/utils/google_sheet.py build/plugins/utils/
          cp plugins/utils/aws.py build/plugins/utils/
          touch build/plugins/__init__.py
          touch build/plugins/utils/__init__.py

          cd build && zip -r ../lambda.zip . && cd ..
          sha256sum lambda.zip | awk '{print $1}' > sha256.txt

      - name: Upload to S3
        run: |
          SHA=$(git rev-parse --short HEAD)
          aws s3 cp lambda.zip s3://your-bucket/lambda-artifacts/sheet-transformer/${SHA}.zip
          aws s3 cp sha256.txt s3://your-bucket/lambda-artifacts/sheet-transformer/${SHA}.sha256
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}